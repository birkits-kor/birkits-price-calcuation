<script src="data.js"></script>
<script>
// --- [1단계: 구글 시트 웹앱 API 연동 설정] ---
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxon0mBjGg4-NmUZ1JwfQFXtbxuX_bNSR03PiYCxn8hi6Tx8HbmE5NtfeQWVFW7O51V3A/exec";
let globalInventory = {};

// 페이지 로드 시 즉시 재고 정보 조회
window.addEventListener('DOMContentLoaded', async () => {
    try {
        const response = await fetch(SCRIPT_URL);
        globalInventory = await response.json();
        console.log("재고 연동 완료:", globalInventory);
    } catch (error) {
        console.error("재고 연동 실패:", error);
    }
});

let currentLineup = 'ma';
let selectedItems = [];

function switchLineup(l) { 
    currentLineup = l; 
    document.getElementById('tab-ma').classList.toggle('active', l === 'ma'); 
    document.getElementById('tab-shuv').classList.toggle('active', l === 'shuv');
    document.getElementById('fabricBtn').style.display = l === 'shuv' ? 'flex' : 'none';
}

function execPostcode() { 
    new daum.Postcode({ oncomplete: function(d) { 
        document.getElementById('custAddr').value = d.address; 
        document.getElementById('custAddrDetail').focus(); 
    }}).open(); 
}

/* === 공통 모달 UI 함수 === */
function showModal(title, step, contentFunc) {
    const l = document.getElementById('optionList');
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('stepIndicator').innerText = step;
    l.innerHTML = '';
    contentFunc(l);
    document.getElementById('modalOverlay').style.display = 'flex';
}

/* === 프레임 단품 로직 === */
function startFrameFlow() {
    const totalSteps = currentLineup === 'ma' ? 2 : 1;
    showModal("프레임 사이즈 선택", `STEP 1/${totalSteps}`, (l) => {
        const frames = data[currentLineup].framePrices;
        for (let size in frames) {
            const div = document.createElement('div'); div.className = 'option-item';
            div.onclick = () => selectFrameColor(size);
            div.innerHTML = `<span>${size} 사이즈</span><span style="color:#ccc;">❯</span>`;
            l.appendChild(div);
        }
    });
}

// --- [2단계: 마베드 프레임 한정 재고 UI 렌더링 적용] ---
function selectFrameColor(size) {
    if (currentLineup === 'shuv') {
        const p = data.shuv.framePrices[size];
        addItem(`${size} 프레임 (보에르 Fog)`, p.p, 'shuv', '', p.op);
        closeModal();
    } else {
        showModal("프레임 색상 선택", "STEP 2/2", (l) => {
            const colors = data.ma.colors;
            const p = data.ma.framePrices[size];
            colors.forEach(color => {
                // 구글 시트와 매칭할 정확한 상품명 조합 (예: [마베드] SS 프레임 (그레이))
                const targetItemName = `[마베드] ${size} 프레임 (${color})`;
                const stockQty = globalInventory[targetItemName];
                
                let stockUI = "";
                let isSoldOut = false;

                // 재고 데이터가 존재할 경우 분기 처리
                if (stockQty !== undefined) {
                    if (Number(stockQty) <= 0) {
                        stockUI = `<span style="color:var(--sale-color); font-size:0.75rem; margin-left:8px; font-weight:bold;">[품절]</span>`;
                        isSoldOut = true;
                    } else {
                        stockUI = `<span style="color:var(--point-color); font-size:0.75rem; margin-left:8px; font-weight:bold;">(재고: ${stockQty}개)</span>`;
                    }
                }

                const div = document.createElement('div'); 
                div.className = 'option-item';
                
                // 품절 시 클릭 차단 및 시각적 비활성화
                if (isSoldOut) {
                    div.style.opacity = '0.4';
                    div.style.cursor = 'not-allowed';
                    div.onclick = () => alert('현재 품절된 상품입니다.');
                } else {
                    div.onclick = () => { addItem(`${size} 프레임 (${color})`, p.p, 'ma', '', p.op); closeModal(); };
                }
                
                div.innerHTML = `<div><span>${color}</span>${stockUI}</div><span style="color:#ccc;">❯</span>`;
                l.appendChild(div);
            });
        });
    }
}

/* === 헤드 단품 2단계 로직 === */
function startHeadFlow() {
    const totalSteps = 2; 
    showModal("헤드 사이즈 선택", `STEP 1/${totalSteps}`, (l) => {
        const headPrices = data[currentLineup].headPrices;
        for (let size in headPrices) {
            const div = document.createElement('div'); div.className = 'option-item';
            div.onclick = () => selectHeadType(size, null);
            div.innerHTML = `<span>${size} 사이즈</span><span style="color:#ccc;">❯</span>`;
            l.appendChild(div);
        }
    });
}

function selectHeadType(size, color) {
    const step = 2; 
    const total = 2; 
    showModal("헤드 구성 선택", `STEP ${step}/${total}`, (l) => {
        const options = data[currentLineup].headPrices[size];
        for (let typeName in options) {
            const p = options[typeName];
            const div = document.createElement('div'); div.className = 'option-item';
            div.onclick = () => {
                const name = color ? `${size} ${typeName} (${color})` : `${size} ${typeName}`;
                addItem(name, p.p, currentLineup, '', p.op);
                closeModal();
            };
            div.innerHTML = `<div><span>${typeName}</span><div style="margin-top:2px;"><span class="price-origin">₩${p.op.toLocaleString()}</span><span class="price-final" style="display:inline; font-size:0.95rem;">₩${p.p.toLocaleString()}원</span></div></div>`;
            l.appendChild(div);
        }
    });
}

/* === 패브릭 커스텀 2단계 로직 === */
function startFabricFlow() {
    showModal("패브릭 종류 선택", "STEP 1/2", (l) => {
        const groups = data.shuv.fabricGroups;
        for (let groupName in groups) {
            const div = document.createElement('div'); div.className = 'option-item';
            div.onclick = () => selectFabricColor(groupName);
            div.innerHTML = `<span>${groupName}</span><span style="color:#ccc;">❯</span>`;
            l.appendChild(div);
        }
    });
}

function selectFabricColor(groupName) {
    showModal(`${groupName} 컬러 선택`, "STEP 2/2", (l) => {
        const options = data.shuv.fabricGroups[groupName];
        options.forEach(opt => {
            const div = document.createElement('div'); div.className = 'option-item';
            div.onclick = () => { addItem(`패브릭 (${groupName} - ${opt.n})`, opt.p, 'shuv', '', opt.op); closeModal(); };
            div.innerHTML = `<div><span>${opt.n}</span><div style="margin-top:2px;">${opt.op > 0 ? `<span class="price-origin">₩${opt.op.toLocaleString()}</span>` : ''}<span style="font-weight:bold;">+ ₩${opt.p.toLocaleString()}원</span></div></div>`;
            l.appendChild(div);
        });
    });
}

/* === 매트리스 단품 2단계 로직 === */
function startMattressFlow() {
    showModal("매트리스 사이즈 선택", "STEP 1/2", (l) => {
        for (let size in mattressPrices) {
            const div = document.createElement('div'); div.className = 'option-item';
            div.onclick = () => selectMattressType(size);
            div.innerHTML = `<span>${size} 사이즈</span><span style="color:#ccc;">❯</span>`;
            l.appendChild(div);
        }
    });
}

function selectMattressType(size) {
    showModal("강도(타입) 선택", "STEP 2/2", (l) => {
        const types = mattressPrices[size];
        for (let typeName in types) {
            const p = types[typeName];
            const div = document.createElement('div'); div.className = 'option-item';
            div.onclick = () => { addItem(`${size} 매트리스 (${typeName})`, p.p, currentLineup, '', p.op); closeModal(); };
            div.innerHTML = `<div><span>${typeName}</span><div style="margin-top:2px;"><span class="price-origin">₩${p.op.toLocaleString()}</span><span class="price-final" style="display:inline; font-size:0.95rem;">₩${p.p.toLocaleString()}원</span></div></div>`;
            l.appendChild(div);
        }
    });
}

/* === 삭제된 세트 로직 대체 (오류 방지) === */
function startSetFlow() {
    alert("세트 상품 기능은 제외되었습니다.");
}

// 기타 단품
function openModal(c) {
    showModal("옵션 추가", "", (l) => {
        let opts = [];
        if(c === 'delivery') opts = deliveryData;
        else if(c === 'lights') opts = [{n:"무드등 한쪽", op:70000, p:35000}, {n:"무드등 양쪽", op:140000, p:70000}];
        else opts = data[currentLineup][c];
        
        opts.forEach(opt => {
            const div = document.createElement('div'); div.className = 'option-item';
            div.onclick = () => { addItem(opt.n, opt.p, currentLineup, "", opt.op); closeModal(); };
            div.innerHTML = `<div><span>${opt.n}</span><div style="margin-top:2px;">${opt.op > 0 ? `<span class="price-origin">₩${opt.op.toLocaleString()}</span>` : ''}<span style="font-weight:bold; color:#555;">₩${opt.p.toLocaleString()}원</span></div></div><span style="color:var(--point-color); font-weight:bold;">+</span>`;
            l.appendChild(div);
        });
    });
}

function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
function addItem(n, p, b, d, op) { selectedItems.push({ id: Date.now(), name: `[${b === 'ma' ? '마베드' : '슈브'}] ${n}`, price: p, desc: d, origin: op }); render(); }
function removeItem(id) { selectedItems = selectedItems.filter(i => i.id !== id); render(); }

function render() {
    const list = document.getElementById('itemList'); list.innerHTML = ''; let t = 0;
    selectedItems.forEach(i => { t += i.price;
        list.innerHTML += `<div class="item-row"><div style="flex:1;"><span class="brand-tag ${i.name.includes('마베드') ? 'tag-ma' : 'tag-shuv'}">${i.name.includes('마베드') ? 'MA BED' : 'SHUV'}</span><strong style="display:block; margin-top:5px;">${i.name.replace(/^\[.*?\]\s*/, '')}</strong>${i.desc ? `<span class="set-desc">구성: ${i.desc}</span>` : ''}<div class="price-group">${i.origin > 0 ? `<span class="price-origin">₩${i.origin.toLocaleString()}</span>` : ''}<span class="price-final">₩${i.price.toLocaleString()}원</span></div></div><button onclick="removeItem(${i.id})" style="border:none; background:none; font-size:1.5rem; color:#ccc; cursor:pointer;">×</button></div>`;
    }); document.getElementById('totalDisplay').innerText = t.toLocaleString();
}

function copyText() {
    if(!selectedItems.length) return alert("선택된 품목이 없습니다.");
    const s = { n: document.getElementById('custName').value, p: document.getElementById('custPhone').value, a: document.getElementById('custAddr').value + " " + document.getElementById('custAddrDetail').value, m: document.getElementById('custMsg').value };
    const items = selectedItems.map(i => `- ${i.name} ${i.desc ? `(${i.desc})` : ''} : ${i.price.toLocaleString()}원`).join('\n');
    const txt = `[버킷츠 견적서]\n고객명: ${s.n}\n연락처: ${s.p}\n주소: ${s.a}\n\n${items}\n\n총 합계: ${document.getElementById('totalDisplay').innerText}원`;
    const t = document.createElement("textarea"); document.body.appendChild(t); t.value = txt; t.select(); document.execCommand('copy'); document.body.removeChild(t); alert("견적 내역이 복사되었습니다!");
}

async function downloadImage() {
    if(!selectedItems.length) return alert("선택된 품목이 없습니다.");
    const r = document.getElementById('receipt-temp');
    const s = { n: document.getElementById('custName').value, p: document.getElementById('custPhone').value, a: document.getElementById('custAddr').value + " " + document.getElementById('custAddrDetail').value };
    let h = `<div class="receipt-h"><strong style="font-size:22px;">birkits</strong><br><span style="font-size:12px;">스마트 견적서</span></div><div style="margin-bottom:20px; font-size:12px; line-height:1.6; border-bottom:1px solid #eee; padding-bottom:15px;"><strong>고객명:</strong> ${s.n}<br><strong>연락처:</strong> ${s.p}<br><strong>주소:</strong> ${s.a}</div>`;
    selectedItems.forEach(i => { h += `<div class="receipt-line"><div style="flex:1;"><span style="font-weight:bold;">${i.name.replace(/^\[.*?\]\s*/, '')}</span>${i.desc ? `<br><span style="font-size:11px; color:#888;">${i.desc}</span>` : ''}</div><span style="font-weight:bold;">${i.price.toLocaleString()}</span></div>`; });
    h += `<div style="margin-top:20px; border-top:2px solid #333; padding-top:15px; display:flex; justify-content:space-between; font-weight:bold; font-size:18px; color:var(--sale-color);"><span>총 합계</span><span>${document.getElementById('totalDisplay').innerText}원</span></div>`;
    r.innerHTML = h;
    try { const canvas = await html2canvas(r, { scale: 2 }); const link = document.createElement('a'); link.download = '견적서.png'; link.href = canvas.toDataURL(); link.click(); } catch (e) { alert("저장 실패"); }
}
</script>
